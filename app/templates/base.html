<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% if title %}
        {{title}}
        {% else %}
        {{ "Welcome to Michałoblog" }}
        {% endif %}
    </title>
</head>
<body>
    <div>Michałoblog:
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('pakiernia') }}">Pakiernia</a>
        <a href="{{ url_for('ford') }}">Ford</a>
        <a href="{{ url_for('przyprawy') }}">Przyprawy</a>
    </div>
    <hr>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}
{% block content %}{% endblock %}
</body>
</html>
